<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fisio"><meta name="theme-color" content="#1a495c">
<title>Test de Fisiologia i fisiopatologia I</title>
<style>:root { --bg:#eaf4f8; --surface:#f9fcfd; --ink:#142a33; --muted:#557280; --line:#cfe3ec; --head:#1a495c; --accent:#276e8b; --ko:#b23b2e;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif; --f-body:"Source Sans 3","Helvetica Neue",Arial,sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#1b1720; --surface:#26212d; --ink:#f0ebf5; --muted:#b0a6bd; --line:#3d3548; --head:#110e15; --accent:#c9a6ee; --ko:#f08a7c; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.caixa { width: 100%; max-width: 420px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 28px 24px; }
.ull { width: 44px; height: 44px; border-radius: 50%; background: var(--head); display: grid; place-items: center; margin-bottom: 14px; }
.ull i { width: 16px; height: 16px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 5px var(--accent); }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; margin: 0 0 4px; text-wrap: balance; }
p { margin: 0 0 16px; color: var(--muted); font-size: .93rem; }
label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
input[type=password] { width: 100%; font: inherit; padding: 11px 13px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
input[type=password]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.recorda { display: flex; gap: 8px; align-items: center; margin: 12px 0 18px; font-size: .88rem; color: var(--muted); }
button { width: 100%; border: 0; border-radius: 10px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer; background: var(--head); color: #fff; }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--ko); font-size: .88rem; min-height: 1.3em; margin: 10px 0 0; }
.peu { margin: 16px 0 0; font-size: .78rem; }
.app { margin-top: 14px; border-top: 1.5px solid var(--line); padding-top: 12px; font-size: .85rem; }
.app summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.app p { margin: 8px 0 0; color: var(--ink); font-size: .85rem; }
/* fons: traces de potencial d'acció que llisquen a poc a poc */
body { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22240%22%20height%3D%22160%22%20viewBox%3D%220%200%20240%20160%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%23276e8b%22%20stroke-opacity%3D%22.16%22%20stroke-width%3D%222.6%22%20stroke-linejoin%3D%22round%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M0%2070%20L34%2070%20L40%2064%20L46%208%20L52%2080%20L60%2086%20L76%2074%20L120%2070%20120%2070%20L154%2070%20L160%2064%20L166%208%20L172%2080%20L180%2086%20L196%2074%20L240%2070%22/%3E%3C/g%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%233494ba%22%20stroke-opacity%3D%22.10%22%20stroke-width%3D%222%22%3E%3Cpath%20d%3D%22M60%20140%20L94%20140%20L100%20134%20L106%2078%20L112%20150%20L120%20156%20L136%20144%20L180%20140%20180%20140%20L214%20140%20L220%20134%20L226%2078%20L232%20150%20L240%20156%20L256%20144%20L300%20140%22/%3E%3C/g%3E%3C/svg%3E"), radial-gradient(ellipse at 20% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%);
  background-size: 240px 160px, 100% 100%; background-attachment: fixed; animation: pa-llisca 50s linear infinite; }
@keyframes pa-llisca { from { background-position: 0 0, 0 0; } to { background-position: 480px 160px, 0 0; } }
@media (prefers-reduced-motion: reduce) { body { animation: none; } }

.caixa { box-shadow: 0 12px 44px rgba(10,40,55,.18), 0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent); }
button#go { background: linear-gradient(118deg, #0b2430 0%, #1a495c 50%, #276e8b 100%); box-shadow: 0 6px 18px -8px rgba(10,40,55,.6), inset 0 1px 0 rgba(220,245,252,.25); }
button#go:hover { filter: brightness(1.08); }
</style>

<main class="caixa" id="caixa">
  <div class="ull" aria-hidden="true"><i></i></div>
  <h1>Test de Fisiologia i fisiopatologia I</h1>
  <p id="intro">Accés amb contrasenya fins al 10 de novembre de 2026.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Contrasenya</label>
    <input type="password" id="pw" required autocomplete="current-password">
    <div class="recorda"><input type="checkbox" id="rec" checked><label for="rec" style="margin:0;font-weight:500">Recorda-la en aquest dispositiu</label></div>
    <button id="go" type="submit">Obre el test</button>
    <div class="err" id="err" role="alert"></div>
  </form>
  <p class="peu">Els resultats es guarden només al navegador de cada dispositiu.</p>
  <details class="app" id="app-ajuda"><summary>Instal·la-ho com una app</summary>
    <p><b>iPhone / iPad</b> (Safari): <b>Compartir</b> → <b>Afegir a la pantalla d'inici</b></p>
    <p><b>Android</b> (Chrome): <b>⋮</b> → <b>Instal·la l'aplicació</b></p>
  </details>
</main>

<script>
"use strict";
const TANCA = Date.parse("2026-11-09T23:00:00Z");
const CLAU = "test-fisio-b14-pw";
const HEADTAGS = `<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fisio"><meta name="theme-color" content="#1a495c">`;
const P = JSON.parse(document.getElementById("xifrat").textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function desxifra(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

  const ds = new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip")));
  return await ds.text();
}
// comptador anònim: el primer cop que un dispositiu obre el test, envia només el nom del repositori a un Google Form
function compta() {

}
function obre(html) { document.open(); document.write(html.replace("<head>", "<head>" + HEADTAGS)); document.close(); }
